<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f3a5f">
<title>Kursfortegnelse</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#f3f5f8; --card:#fff; --ink:#1b2430; --muted:#6b7686; --line:#dfe4ea;
  --brand:#1f3a5f; --accent:#1f5fa8; --accent-soft:#e3edf9; --danger:#b8352a; --ok:#2e7d4f; --warn:#a86b00;
  --radius:14px;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}

/* Topbar */
.top{position:sticky;top:0;z-index:20;background:var(--brand);color:#fff;padding:calc(var(--st) + 10px) 12px 10px;display:flex;align-items:center;gap:8px}
.top h1{font-size:18px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:650}
.top .sub{display:block;font-size:12px;font-weight:400;opacity:.75}
.iconbtn{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;flex:none}
.iconbtn:active{background:rgba(255,255,255,.15)}
.iconbtn svg{width:22px;height:22px}
.tabs{position:sticky;top:calc(var(--st) + 60px);z-index:19;display:flex;background:var(--brand);padding:0 8px 8px;gap:6px}
.tabs button{flex:1;padding:9px 4px;border-radius:10px;color:#cfdcec;font-size:14px;font-weight:600}
.tabs button.on{background:#fff;color:var(--brand)}

main{padding:12px 12px calc(100px + var(--sb));max-width:760px;margin:0 auto}

/* Cards / lists */
.card{background:var(--card);border-radius:var(--radius);box-shadow:0 1px 2px rgba(20,30,50,.06);border:1px solid var(--line)}
.board{display:block;width:100%;text-align:left;padding:14px 16px;margin-bottom:10px}
.board .t{font-weight:650;font-size:17px}
.board .m{color:var(--muted);font-size:13px;margin-top:2px}
.empty{color:var(--muted);text-align:center;padding:40px 16px}

.kurs{display:flex;width:100%;text-align:left;align-items:stretch;padding:0;margin-bottom:8px;overflow:hidden}
.kurs .nr{flex:none;width:76px;padding:12px 8px;background:var(--accent-soft);color:var(--brand);font:600 14px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;display:flex;align-items:center;justify-content:center;text-align:center;word-break:break-all}
.kurs .b{flex:1;min-width:0;padding:10px 12px}
.kurs .d{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kurs .d.none{color:var(--muted);font-weight:400;font-style:italic}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.tag{font-size:12px;padding:2px 7px;border-radius:999px;background:#eef1f5;color:#3b4656;white-space:nowrap}
.tag.v{background:#e7f0e9;color:#245c3b}
.tag.k{background:#fdf1dc;color:#7a5200}
.tag.j{background:#f6e6f4;color:#7a2a6e}
.kurs:active{background:#f7f9fc}

.fab{position:fixed;right:16px;bottom:calc(18px + var(--sb));z-index:15;background:var(--accent);color:#fff;border-radius:18px;padding:15px 20px;font-weight:650;box-shadow:0 6px 18px rgba(31,95,168,.35);display:flex;gap:8px;align-items:center}
.fab svg{width:20px;height:20px}

.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{padding:12px 16px;border-radius:12px;font-weight:600;background:#fff;border:1px solid var(--line)}
.btn.p{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.d{color:var(--danger)}
.btn.block{width:100%}
.btn:disabled{opacity:.5}

/* Forms */
.sec{margin:14px 0 8px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.form{padding:4px 14px 14px}
.fld{padding-top:10px}
.fld>label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.fld input,.fld select,.fld textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fbfcfd;outline:none}
.fld input:focus{border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px var(--accent-soft)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 10px}
.unit{position:relative}
.unit input{padding-right:46px}
.unit span{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:13px;color:var(--muted);pointer-events:none}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 13px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:15px;font-weight:550}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}

/* Bottom sheet */
.scrim{position:fixed;inset:0;background:rgba(15,25,40,.45);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:94vh;background:var(--bg);border-radius:18px 18px 0 0;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .25s cubic-bezier(.2,.8,.2,1);max-width:760px;margin:0 auto}
.sheet.on{transform:none}
.sh-head{display:flex;align-items:center;gap:6px;padding:10px 10px 6px;border-bottom:1px solid var(--line)}
.sh-head h2{flex:1;margin:0;font-size:17px}
.sh-body{overflow-y:auto;padding:0 14px 14px;flex:1;overscroll-behavior:contain}
.sh-foot{display:flex;gap:8px;padding:10px 12px calc(10px + var(--sb));border-top:1px solid var(--line);background:#fff}
.sh-foot .btn{flex:1}

/* Dialog + toast */
.dlg{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:20px;background:rgba(15,25,40,.45)}
.dlg .card{padding:18px;max-width:360px;width:100%}
.dlg h3{margin:0 0 8px}
.dlg p{margin:0 0 16px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(90px + var(--sb));transform:translateX(-50%);z-index:70;background:#1b2430;color:#fff;padding:12px 14px 12px 16px;border-radius:12px;display:flex;gap:14px;align-items:center;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:92vw}
.toast button{color:#8fc1ff;font-weight:700}

.menu{position:absolute;right:10px;top:calc(var(--st) + 54px);z-index:30;background:#fff;color:var(--ink);border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.2);overflow:hidden;min-width:210px}
.menu button{display:block;width:100%;text-align:left;padding:13px 16px;border-bottom:1px solid var(--line)}
.menu button:last-child{border-bottom:0}

.notice{padding:12px 14px;border-radius:12px;background:#fff7e6;border:1px solid #f1d9a6;color:#6b4a00;font-size:14px;margin-bottom:12px}
.check{padding:10px 14px;font-size:14px}
.check div{padding:3px 0}
.check .w{color:var(--warn)}
.check .o{color:var(--ok)}

/* Preview of A4 */
.preview-wrap{overflow:hidden;border-radius:8px;box-shadow:0 2px 10px rgba(20,30,50,.15);background:#fff;margin:12px 0}
.preview-inner{transform-origin:0 0}

/* ---------- Printed document (A4 @ 96dpi = 794 x 1123 px) ---------- */
.page{width:794px;height:1123px;padding:52px 56px 40px;background:#fff;color:#000;font:11px/1.25 Arial,Helvetica,sans-serif;position:relative;display:flex;flex-direction:column;overflow:hidden}
.page + .page{margin-top:16px}
.page h1{font-size:20px;margin:0 0 14px;padding-bottom:4px;border-bottom:1px solid #000;width:260px}
.hb{display:flex;gap:22px;margin-bottom:18px}
.hb table{border-collapse:collapse}
.hb td{border:1px solid #555;padding:2px 5px;height:18px;white-space:nowrap}
.hb .cap{background:#dbe9f6;font-variant:small-caps;font-weight:700;font-size:10.5px}
.hb .num{text-align:right}
.hb .imp{font-weight:700;font-size:9.5px;white-space:normal;width:120px;vertical-align:top;line-height:1.2}
.kt{border-collapse:collapse;width:100%;table-layout:fixed}
.kt th{background:#dbe9f6;font-weight:400;border:1px solid #555;padding:3px 2px;font-size:10.5px}
.kt td{border:1px solid #555;padding:0 4px;height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kt td.c{text-align:center}
.foot{margin-top:auto;border:1px solid #555;display:grid;grid-template-columns:47% 28% 25%;font-size:9px}
.foot>div{border:1px solid #555;padding:3px 5px;min-height:34px}
.foot b{font-size:8.5px}
.foot .big{font-size:14px}
.foot .firma{display:flex;gap:10px;align-items:center}
.foot .firma .fn{font-weight:700;font-size:14px;color:#1f3a5f;min-width:110px}

/* Bolig-mal */
.page.bolig{padding:40px 50px 34px;font-family:Arial,Helvetica,sans-serif}
.bl-title{text-align:center;font-weight:700;font-size:22px;margin-bottom:12px}
.bl-title small{font-size:11px;font-weight:400}
.bl{border-collapse:collapse;width:100%;table-layout:fixed;border:2px solid #000}
.bl td,.bl th{border:1px solid #000;padding:1px 5px;font-size:12px}
.bl .c{text-align:center}
.bl-head td{vertical-align:top;height:34px}
.bl-head .lab{font-size:11px;line-height:1.25}
.bl-head .lab b{font-size:12.5px}
.bl-logo{text-align:center;vertical-align:middle!important}
.bl-logo img{max-width:100%;max-height:56px;object-fit:contain}
.bl-fn{font-weight:700;font-size:20px;color:#1f3a5f}
.bl-cols th{font-weight:700;font-size:12px;line-height:1.15;padding:3px 2px;border-bottom:2px solid #000}
.bl-row td{height:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bl-kom{height:100px;vertical-align:top;font-size:12px!important;border-top:2px solid #000!important}
.bl-kom div{margin-top:3px;white-space:normal}
.bl-foot{margin-top:auto;font-family:"Times New Roman",Times,serif;font-size:9.5px}
.bl-fname{text-align:center;font-weight:700;font-size:12.5px;margin-bottom:8px}
.bl-fcols{display:grid;grid-template-columns:1fr 1fr 1fr}
.bl-fcols .c{text-align:center}.bl-fcols .r{text-align:right}

#print-root{display:none}
@page{size:A4;margin:0}
@media print{
  html,body{background:#fff}
  body>*:not(#print-root){display:none!important}
  #print-root{display:block}
  #print-root .page{margin:0;page-break-after:always;break-after:page}
  #print-root .page:last-child{page-break-after:auto;break-after:auto}
}
</style>
</head>
<body>
<div id="app"></div>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"></div>
<div id="layer"></div>
<div id="print-root"></div>

<script>
'use strict';
/* ================= Data ================= */
const LS = 'kursfortegnelse.v1';
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const OPTS = {
  type: ['Automat', 'Jordfeilautomat', 'EFF.BR.', 'Smeltesikring', 'Lastbryter'],
  inn: ['6','10','13','16','20','25','32','40','50','63','80','100','125','160','200','250'],
  kar: ['B','C','D'],
  s: ['1,5','2,5','4','6','10','16','25','35','50','70','95','120','150','185','240'],
  ref: ['A1','A2','B1','B2','C','D1','D2','E','F'],
  jfb: ['30','100','300','500'],
  system: ['TN-S','TN-C-S','TN-C','IT','TT'],
  spenning: ['230','400'],
};

const defaultFirma = () => ({ navn: 'Avitell AS', adr: 'Industrigata 5', post: '4632 KRISTIANSAND', tlf: '+38 17 88 88', orgnr: '910 405 004', web: 'www.avitell.no', logo: 'logo.png' });

const MALER = {
  bolig: { navn: 'Bolig (forenklet)', kort: 'Bolig' },
  naering: { navn: 'Næring (Febdok-oppsett)', kort: 'Næring' },
};
const BOLIG_KURSER = ['Lastbryter', 'Overspenningsvern', 'Soverom og Baderom', 'Stue og Gang', 'Kjøkkenstikk',
  'Oppvaskmaskin', 'Ovn', 'Platetopp', 'Vaskemaskin', 'Tørketrommel', 'Ventilasjonsanlegg'];

function newBoard(mal = 'naering') {
  const b = { id: uid(), mal, fordeling: '', forsyntFra: '', ikMaks: '', ikMin: '', ijMaks: '', ijMin: '',
    spenning: '400', frekvens: '50', tilforsel: '', system: 'TN-S', forankoblet: '', jordelektrode: '',
    anlegg: '', adresse: '', dato: '', norm: 'NEK 400:2018',
    kunde: '', tavle: '', kommentar: '', kurser: [], updated: Date.now() };
  if (mal === 'bolig') {
    b.spenning = '230';
    b.kurser = BOLIG_KURSER.map((d, i) => newKurs({ nr: String(i + 1), beskr: d }));
  }
  return b;
}
const isBolig = b => b && b.mal === 'bolig';
const boardTitle = b => isBolig(b) ? (b.kunde || b.tavle || 'Ny bolig') : (b.fordeling || 'Ny fordeling');
const boardSub = b => isBolig(b) ? [b.adresse, b.tavle && ('Tavle ' + b.tavle)].filter(Boolean).join(' · ') : (b.anlegg || '');
function newKurs(o = {}) {
  return Object.assign({ id: uid(), nr: '', beskr: '', type: '', inn: '', kar: '', s: '', l: '', ref: '', rekke: '', jfb: '' }, o);
}
function seed() {
  const b = Object.assign(newBoard(), {
    fordeling: '433.004 MENY', forsyntFra: 'OVERBELASNINGSVERN',
    ikMaks: '27,945', ikMin: '21,883', ijMaks: '27,546', ijMin: '23,350',
    tilforsel: '3 x 4 x 240', forankoblet: 'EFF.BR. 4x800 A',
    anlegg: 'Vennesla Atrium Næringsdel', dato: '14.11.2022 14:01:01'
  });
  b.kurser = [
    newKurs({ nr: '0', beskr: '433.004 Meny', s: '240', l: '24', ref: 'E' }),
    newKurs({ nr: 'XS1', beskr: 'Hovedbryter (Lastbryter)' }),
    newKurs({ nr: '-XQ2', beskr: '433.100A Meny teknisk rom 1.etg', type: 'EFF.BR.', inn: '128', s: '95', l: '43', ref: 'E' }),
    newKurs({ nr: '-XQ3', beskr: '433.100B Meny ferskvare 1.etg', type: 'EFF.BR.', inn: '225', s: '240', l: '71', ref: 'E' }),
    newKurs({ nr: '.XQ4', beskr: '434.001 Kjøletavle Meny', type: 'EFF.BR.', inn: '250', s: '240', l: '17', ref: 'E' }),
    newKurs({ nr: '-XQ5', beskr: 'Ventilasjon varmebatteri', type: 'EFF.BR.', inn: '63', s: '16', l: '17', ref: 'E' }),
    newKurs({ nr: '-XQ6', beskr: 'Ventilasjonsanlegg', type: 'EFF.BR.', inn: '32', s: '6', l: '20', ref: 'E' }),
    newKurs({ nr: '-QE10', beskr: 'Overspenningsvern' }),
  ];
  return b;
}

function load() {
  try {
    const d = JSON.parse(localStorage.getItem(LS));
    if (d && Array.isArray(d.boards)) {
      d.firma = Object.assign(defaultFirma(), d.firma || {});
      d.boards.forEach(b => { if (!b.mal) b.mal = 'naering'; });
      return d;
    }
  } catch (e) {}
  return { boards: [seed()], firma: defaultFirma() };
}
let db = load();
function save() {
  try { localStorage.setItem(LS, JSON.stringify(db)); } catch (e) {}
}
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}

/* ================= State / routing ================= */
const ui = { boardId: null, tab: 'kurser', editing: null, isNew: false, insertAfter: null, sheetMode: null };
const board = () => db.boards.find(b => b.id === ui.boardId);
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];

function route() {
  const h = location.hash.slice(1);
  const m = h.match(/^f-([a-z0-9]+)(?:-(kurser|data|gen))?(-e)?$/);
  if (m && db.boards.some(b => b.id === m[1])) {
    ui.boardId = m[1]; ui.tab = m[2] || 'kurser';
  } else { ui.boardId = null; }
  if (!h.endsWith('-e') && $('#sheet').classList.contains('on')) hideSheet();
  if (h.endsWith('-e') && !$('#sheet').classList.contains('on')) { history.replaceState(null, '', '#' + h.slice(0, -2)); }
  render();
}
function go(hash) { if (location.hash.slice(1) !== hash) location.hash = hash; else route(); }
window.addEventListener('hashchange', route);

/* ================= Icons ================= */
const I = {
  back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
  more: '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  gear: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>',
};

/* ================= Render ================= */
function render() {
  const app = $('#app');
  if (!ui.boardId) return renderList(app);
  const b = board();
  app.innerHTML = `
    <div class="top">
      <button class="iconbtn" data-a="home" aria-label="Tilbake">${I.back}</button>
      <h1>${headTitle(b)}</h1>
      <button class="iconbtn" data-a="menu" aria-label="Meny">${I.more}</button>
    </div>
    <div class="tabs">
      ${[['kurser','Kurser'],['data','Anleggsdata'],['gen','Generer']].map(([k,l]) =>
        `<button class="${ui.tab===k?'on':''}" data-tab="${k}">${l}</button>`).join('')}
    </div>
    <main id="main"></main>
    ${ui.tab === 'kurser' ? `<button class="fab" data-a="add">${I.plus} Nytt kurs</button>` : ''}`;
  const main = $('#main');
  if (ui.tab === 'kurser') renderKurser(main, b);
  else if (ui.tab === 'data') renderData(main, b);
  else renderGen(main, b);
}

function headTitle(b) {
  const s = boardSub(b);
  return `${esc(boardTitle(b))}<span class="sub">${esc(MALER[b.mal].kort)} · ${s ? esc(s) + ' · ' : ''}${b.kurser.length} kurs</span>`;
}
function renderList(app) {
  const list = [...db.boards].sort((a, b) => (b.updated || 0) - (a.updated || 0));
  app.innerHTML = `
    <div class="top">
      <h1 style="padding-left:6px">Kursfortegnelser</h1>
      <button class="iconbtn" data-a="settings" aria-label="Innstillinger">${I.gear}</button>
    </div>
    <main>
      ${list.length ? list.map(b => `
        <button class="card board" data-open="${b.id}">
          <div class="t">${esc(boardTitle(b))} <span class="tag ${isBolig(b) ? 'k' : 'v'}" style="vertical-align:middle">${MALER[b.mal].kort}</span></div>
          <div class="m">${esc(boardSub(b) || 'Ikke utfylt')} · ${b.kurser.length} kurs · endret ${fmtDate(b.updated)}</div>
        </button>`).join('') : `<div class="empty">Ingen fordelinger ennå.<br>Trykk «Ny fordeling» for å starte.</div>`}
      <div class="row" style="margin-top:14px">
        <label class="btn" style="flex:1;text-align:center">Importer fil<input type="file" accept=".json,application/json" data-a="import" hidden></label>
      </div>
    </main>
    <button class="fab" data-a="newboard">${I.plus} Ny fordeling</button>`;
}

function kursTags(k) {
  const t = [];
  const vern = [k.type, [k.kar, k.inn && (k.inn + ' A')].filter(Boolean).join(' ')].filter(Boolean).join(' ');
  if (vern) t.push(`<span class="tag v">${esc(vern)}</span>`);
  const kab = [k.s && (k.s + ' mm²'), k.l && (k.l + ' m'), k.ref].filter(Boolean).join(' · ');
  if (kab) t.push(`<span class="tag k">${esc(kab)}</span>`);
  if (k.jfb) t.push(`<span class="tag j">Jfb ${esc(k.jfb)} mA</span>`);
  if (k.rekke) t.push(`<span class="tag">Rk ${esc(k.rekke)}</span>`);
  return t.join('');
}

/* ---------- Checks + document generation ---------- */
function checks(b) {
  const out = [];
  const seen = {};
  b.kurser.forEach(k => { const n = (k.nr || '').trim(); if (n) seen[n] = (seen[n] || 0) + 1; });
  const dup = Object.keys(seen).filter(n => seen[n] > 1);
  if (dup.length) out.push(['w', `Dupliserte kursnummer: ${dup.join(', ')}`]);
  const noNr = b.kurser.filter(k => !(k.nr || '').trim()).length;
  if (noNr) out.push(['w', `${noNr} kurs mangler kursnummer`]);
  const noDesc = b.kurser.filter(k => !(k.beskr || '').trim()).length;
  if (noDesc) out.push(['w', `${noDesc} kurs mangler beskrivelse`]);
  if (isBolig(b)) {
    const noIn = b.kurser.filter(k => !(k.inn || '').trim()).length;
    if (noIn) out.push(['w', `${noIn} kurs mangler sikring (A)`]);
    if (!b.kunde) out.push(['w', 'Kunde er ikke satt (Anleggsdata)']);
    if (!b.adresse) out.push(['w', 'Adresse er ikke satt (Anleggsdata)']);
  } else {
    if (!b.fordeling) out.push(['w', 'Fordeling er ikke navngitt (Anleggsdata)']);
    if (!b.anlegg) out.push(['w', 'Anlegg er ikke satt (Anleggsdata)']);
  }
  if (!out.length) out.push(['o', 'Alt ser komplett ut']);
  return out;
}

function nowStr() {
  const d = new Date(), p = n => String(n).padStart(2, '0');
  return `${p(d.getDate())}.${p(d.getMonth() + 1)}.${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}
function fmtDate(t) { if (!t) return '–'; const d = new Date(t); return d.toLocaleDateString('no-NO', { day: 'numeric', month: 'short', year: 'numeric' }); }

const FIRST_ROWS = 38, NEXT_ROWS = 49;
const BOLIG_MIN = 26, BOLIG_FIRST = 30, BOLIG_NEXT = 36;
function boligPages(b) {
  const f = db.firma;
  const rows = b.kurser.slice();
  const allInt = rows.every(k => /^\d+$/.test((k.nr || '').trim()));
  const target = Math.max(BOLIG_MIN, rows.length);
  // fyll ut med tomme linjer til minst 26
  let lastNo = allInt && rows.length ? parseInt(rows[rows.length - 1].nr, 10) : rows.length;
  while (rows.length < target) rows.push({ nr: allInt ? String(++lastNo) : '', blank: true });
  const chunks = [rows.slice(0, BOLIG_FIRST)];
  for (let i = BOLIG_FIRST; i < rows.length; i += BOLIG_NEXT) chunks.push(rows.slice(i, i + BOLIG_NEXT));
  const total = chunks.length;
  const sys = [b.system, b.spenning && (b.spenning + 'V')].filter(Boolean).join(' ');
  const logo = f.logo ? `<img src="${esc(f.logo)}" alt="">` : `<span class="bl-fn">${esc(f.navn)}</span>`;
  return chunks.map((ch, i) => `
  <div class="page bolig">
    <div class="bl-title">KURSFORTEGNELSE${total > 1 ? ` <small>side ${i + 1} av ${total}</small>` : ''}</div>

        <td colspan="2" class="lab">Tavle:<br><b>${esc(b.tavle)}</b></td>
      </tr>
      <tr class="bl-head">
        <td colspan="2" class="lab">Adresse:<br>${esc(b.adresse)}</td>
        <td colspan="2" class="lab">Tilførsel:<br><b>${esc(b.tilforsel)}</b></td>
      </tr>
      <tr class="bl-cols"><th>Kurs<br>nr.</th><th colspan="2"></th><th>Sikring<br>Ampere</th><th>Ledning<br>mm²</th><th>Forlegn.<br>måte</th><th>Lengde<br>i meter</th></tr>
      ${ch.map(k => `<tr class="bl-row"><td class="c"><b>${esc(k.nr)}</b></td><td colspan="2">${esc(k.beskr)}</td><td class="c">${esc(k.inn)}</td><td class="c">${esc(k.s)}</td><td class="c">${esc(k.ref)}</td><td class="c">${esc(k.l)}</td></tr>`).join('')}
      ${i === total - 1 ? `<tr><td colspan="7" class="bl-kom"><b>Kommentar:</b><div>${esc(b.kommentar).replace(/\n/g, '<br>')}</div></td></tr>` : ''}
    </table>
    <div class="bl-foot">
      <div class="bl-fname">${esc(f.navn)}</div>
      <div class="bl-fcols">
        <div>${esc(f.adr)}<br>${esc(f.post)}</div>
        <div class="c">${f.tlf ? 'Telefon&nbsp; ' + esc(f.tlf) : ''}</div>
        <div class="r">${f.orgnr ? 'Organisasjonsnummer ' + esc(f.orgnr) : ''}<br>${esc(f.web)}</div>
      </div>
    </div>
  </div>`).join('');
}

      <tr><th>Type</th><th>In [A]</th><th>Kar.</th><th>S [mm²]</th><th>L [m]</th><th>Ref.inst. met.</th><th>Nr</th><th>[mA]</th></tr>
      ${ch.map(k => `<tr><td>${esc(k.nr)}</td><td>${esc(k.beskr)}</td><td class="c">${esc(k.type)}</td><td class="c">${esc(k.inn)}</td><td class="c">${esc(k.kar)}</td><td class="c">${esc(k.s)}</td><td class="c">${esc(k.l)}</td><td class="c">${esc(k.ref)}</td><td class="c">${esc(k.rekke)}</td><td class="c">${esc(k.jfb)}</td></tr>`).join('')}

/* ================= Kurs editor (bottom sheet) ================= */
function usedValues(key) {
  const set = new Set();
  db.boards.forEach(b => b.kurser.forEach(k => { if (k[key]) set.add(String(k[key])); }));
  return [...set];
}
function mergeOpts(key) {
  const base = OPTS[key] || [];
  const extra = usedValues(key).filter(v => !base.includes(v));
  if (key === 'inn' || key === 's' || key === 'jfb') {
    const num = v => parseFloat(String(v).replace(',', '.'));
    return [...base, ...extra].sort((a, b) => (num(a) || 0) - (num(b) || 0));
  }
  return [...base, ...extra];
}
function nextNr(nr) {
  const m = String(nr || '').match(/^(.*?)(\d+)(\D*)$/);
  if (!m) return nr || '';
  const n = String(parseInt(m[2], 10) + 1);
  return m[1] + (m[2].startsWith('0') && m[2].length > 1 ? n.padStart(m[2].length, '0') : n) + m[3];
}

function showSheet() {
  $('#sheet').classList.add('on'); $('#scrim').classList.add('on');
  const h = location.hash.slice(1);
  if (ui.boardId && !h.endsWith('-e')) location.hash = h + '-e';
  else if (!ui.boardId && h !== 'innst-e') location.hash = 'innst-e';
  $('#sheet .sh-body') && ($('#sheet .sh-body').scrollTop = 0);
}
function hideSheet() {
  $('#sheet').classList.remove('on'); $('#scrim').classList.remove('on');
  ui.sheetMode = null;
  if (document.activeElement) document.activeElement.blur();
}
function closeSheet() {
  if (location.hash.endsWith('-e')) history.back(); else hideSheet();
}

function readForm(root, obj) {
  $$('input[data-f]', root).forEach(i => { obj[i.dataset.f] = i.value.trim(); });
  return obj;
}

function saveKurs(next) {
  const b = board();
  const e = readForm($('#sheet'), ui.editing);
  if (ui.isNew) {
    const idx = ui.insertAfter ? b.kurser.findIndex(k => k.id === ui.insertAfter) : -1;
    if (idx >= 0) b.kurser.splice(idx + 1, 0, e); else b.kurser.push(e);
  } else {
    const i = b.kurser.findIndex(k => k.id === e.id);
    if (i >= 0) b.kurser[i] = e;
  }
  touch(b);
  if (next) {
    const n = newKurs({ nr: nextNr(e.nr), type: e.type, inn: e.inn, kar: e.kar, s: e.s, ref: e.ref, jfb: e.jfb });
    render();
    openKurs(n, true, e.id);
    toast(`Lagret ${e.nr || 'kurs'}`);
  } else {
    closeSheet();
    render();
  }
}
function touch(b) { b.updated = Date.now(); save(); }

      ${fld('Adresse', txt('adr', f.adr))}
      ${fld('Postnr og sted', txt('post', f.post))}
      ${fld('Telefon', `<input data-f="tlf" value="${esc(f.tlf)}" inputmode="tel">`)}
      ${fld('Organisasjonsnummer', `<input data-f="orgnr" value="${esc(f.orgnr)}" inputmode="numeric">`)}
      ${fld('Nettside', txt('web', f.web))}
      <div class="sec">Logo</div>
      <div class="card" style="padding:12px;display:grid;place-items:center;min-height:70px" id="logoPrev">${f.logo ? `<img src="${esc(f.logo)}" style="max-width:100%;max-height:60px">` : '<span style="color:var(--muted)">Ingen logo – firmanavnet brukes</span>'}</div>
      <div class="row" style="margin-top:8px">
        <label class="btn" style="flex:1;text-align:center">Velg bilde<input type="file" accept="image/*" data-a="logo" hidden></label>
        <button class="btn" style="flex:1" data-a="logostd">Standard</button>
        <button class="btn d" style="flex:1" data-a="logonone">Ingen</button>
      </div>
      <div class="sec">Sikkerhetskopi</div>
      <p style="color:var(--muted);font-size:14px;margin:0 0 10px">Data lagres bare på denne telefonen. Ta jevnlig kopi av alle fordelinger.</p>
      <button class="btn block" data-a="backup">Eksporter alle fordelinger</button>
    </div>
    <div class="sh-foot"><button class="btn p" data-a="savefirma">Lagre</button></div>`;
  showSheet();
}

/* ================= Dialogs, toast, menu ================= */
function confirmDlg(title, text, okLabel, onOk) {
  const l = $('#layer');
  l.innerHTML = `<div class="dlg"><div class="card"><h3>${esc(title)}</h3><p>${esc(text)}</p>
    <div class="row" style="justify-content:flex-end"><button class="btn" data-d="no">Avbryt</button><button class="btn p" style="background:var(--danger);border-color:var(--danger)" data-d="ok">${esc(okLabel)}</button></div></div></div>`;
  l.onclick = ev => {
    const d = ev.target.closest('[data-d]'); if (!d && ev.target.closest('.card')) return;
    l.innerHTML = ''; l.onclick = null;
    if (d && d.dataset.d === 'ok') onOk();
  };
}
function chooseMal(cb) {
  const l = $('#layer');
  l.innerHTML = `<div class="dlg"><div class="card"><h3>Velg mal</h3>
    <p>Hvilket oppsett skal kursfortegnelsen ha?</p>
    <button class="btn block" data-mal="bolig" style="text-align:left;margin-bottom:8px"><b>Bolig</b><br><span style="font-weight:400;color:var(--muted);font-size:14px">Forenklet: sikring, ledning, forlegning, lengde. Starter med vanlige boligkurser.</span></button>
    <button class="btn block" data-mal="naering" style="text-align:left;margin-bottom:12px"><b>Næring</b><br><span style="font-weight:400;color:var(--muted);font-size:14px">Febdok-oppsett med Ik/Ij, verntype, kar., jordfeil og rekkeklemmer.</span></button>
    <div class="row" style="justify-content:flex-end"><button class="btn" data-mal="">Avbryt</button></div></div></div>`;
  l.onclick = ev => {
    const m = ev.target.closest('[data-mal]'); if (!m && ev.target.closest('.card')) return;
    l.innerHTML = ''; l.onclick = null;
    if (m && m.dataset.mal) cb(m.dataset.mal);
  };
}
let toastT;
function toast(msg, action, fn) {
  clearTimeout(toastT);
  let t = $('.toast'); if (t) t.remove();
  t = document.createElement('div'); t.className = 'toast';
  t.innerHTML = `<span>${esc(msg)}</span>${action ? `<button>${esc(action)}</button>` : ''}`;
  if (action) t.querySelector('button').onclick = () => { t.remove(); fn(); };
  document.body.appendChild(t);
  toastT = setTimeout(() => t.remove(), action ? 6000 : 2200);
}
function showMenu() {
  const m = document.createElement('div'); m.className = 'menu';
  m.innerHTML = `<button data-m="dupboard">Dupliser fordeling</button><button data-m="exportboard">Eksporter fordeling (fil)</button><button data-m="mal">Bytt til ${isBolig(board()) ? 'næringsmal' : 'boligmal'}</button><button data-m="delboard" style="color:var(--danger)">Slett fordeling</button>`;
  const close = () => { m.remove(); document.removeEventListener('click', outside, true); };
  const outside = ev => { if (!m.contains(ev.target)) { close(); ev.stopPropagation(); ev.preventDefault(); } };
  m.onclick = ev => {
    const a = ev.target.closest('[data-m]'); if (!a) return; close();
    const b = board();
    if (a.dataset.m === 'dupboard') {
      const c = JSON.parse(JSON.stringify(b)); c.id = uid(); if (isBolig(b)) c.kunde = (b.kunde || 'Bolig') + ' (kopi)'; else c.fordeling = (b.fordeling || 'Fordeling') + ' (kopi)';
      c.kurser.forEach(k => k.id = uid()); c.updated = Date.now();
      db.boards.push(c); save(); go('f-' + c.id); toast('Fordeling duplisert');
    } else if (a.dataset.m === 'mal') {
      b.mal = isBolig(b) ? 'naering' : 'bolig'; touch(b); render();
      toast(`Bruker nå ${MALER[b.mal].navn.toLowerCase()} – ingen data er slettet`);
    } else if (a.dataset.m === 'exportboard') {
      exportJSON({ app: 'kursfortegnelse', version: 1, boards: [b] }, fileBase(b) + '.json');
    } else if (a.dataset.m === 'delboard') {
      confirmDlg('Slette fordeling?', `«${b.fordeling || 'Uten navn'}» med ${b.kurser.length} kurs slettes fra telefonen.`, 'Slett', () => {
        const i = db.boards.indexOf(b); db.boards.splice(i, 1); save(); go('');
        toast('Fordeling slettet', 'Angre', () => { db.boards.splice(i, 0, b); save(); go('f-' + b.id); });
      });
    }
  };
  document.body.appendChild(m);
  setTimeout(() => document.addEventListener('click', outside, true));
}

/* ================= Export / import ================= */
function fileBase(b) { return ('Kursfortegnelse ' + (isBolig(b) ? [b.kunde, b.tavle].filter(Boolean).join(' ') || 'bolig' : (b.fordeling || 'fordeling'))).replace(/[\\/:*?"<>|]+/g, '-').trim(); }
function download(blob, name) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
async function shareOrDownload(blob, name) {
  try {
    const file = new File([blob], name, { type: blob.type });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  download(blob, name);
}
function exportJSON(obj, name) { shareOrDownload(new Blob([JSON.stringify(obj, null, 2)], { type: 'application/json' }), name); }
function exportCSV(b) {
  const cols = isBolig(b) ? [['nr','Kurs nr.'],['beskr','Beskrivelse'],['inn','Sikring [A]'],['s','Ledning [mm²]'],['ref','Forlegn. måte'],['l','Lengde [m]']] : [['nr','Kurs nr.'],['beskr','Lastbeskrivelse / Utstyr'],['type','Vern type'],['inn','In [A]'],['kar','Kar.'],['s','S [mm²]'],['l','L [m]'],['ref','Ref.inst.met.'],['rekke','Rekkekl. nr'],['jfb','Jfb [mA]']];
  const q = v => { v = String(v ?? ''); return /[;"\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  const lines = [cols.map(c => q(c[1])).join(';'), ...b.kurser.map(k => cols.map(c => q(k[c[0]])).join(';'))];
  shareOrDownload(new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv' }), fileBase(b) + '.csv');
}
function importFile(file) {
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      const list = Array.isArray(d.boards) ? d.boards : (d.kurser ? [d] : null);
      if (!list) throw 0;
      list.forEach(b => {
        const nb = Object.assign(newBoard(), b, { id: uid(), updated: Date.now() });
        nb.kurser = (b.kurser || []).map(k => newKurs(Object.assign({}, k, { id: uid() })));
        db.boards.push(nb);
      });
      save(); render(); toast(`Importerte ${list.length} fordeling${list.length > 1 ? 'er' : ''}`);
    } catch (e) { toast('Kunne ikke lese fila'); }
  };
  r.readAsText(file);
}
function doPrint(b) {
  $('#print-root').innerHTML = docPages(b);
  const old = document.title; document.title = fileBase(b);
  try { window.print(); } catch (e) { toast('Utskrift er ikke tilgjengelig her'); }
  setTimeout(() => { document.title = old; }, 1000);
}

/* ================= Events ================= */
document.addEventListener('click', ev => {
  const t = ev.target;
  const chip = t.closest('.chip');
  if (chip) {
    const row = chip.parentElement, key = row.dataset.chips;
    const scope = row.closest('[data-form]') || document;
    const inp = $(`input[data-f="${key}"]`, scope);
    const v = chip.classList.contains('on') ? '' : chip.dataset.v;
    if (inp) { inp.value = v; inp.dispatchEvent(new Event('input', { bubbles: true })); }
    return;
  }
  const open = t.closest('[data-open]'); if (open) return go('f-' + open.dataset.open);
  const tab = t.closest('[data-tab]'); if (tab) return go(`f-${ui.boardId}-${tab.dataset.tab}`);
  const kk = t.closest('[data-kurs]');
  if (kk) { const k = board().kurser.find(x => x.id === kk.dataset.kurs); return openKurs(k, false); }
  const a = t.closest('[data-a]'); if (!a) return;
  const b = board();
  switch (a.dataset.a) {
    case 'home': go(''); break;
    case 'menu': showMenu(); break;
    case 'settings': openSettings(); break;
    case 'newboard': chooseMal(mal => { const nb = newBoard(mal); db.boards.push(nb); save(); go(`f-${nb.id}-data`); }); break;
    case 'add': {
      const last = b.kurser[b.kurser.length - 1];
      openKurs(newKurs(last ? { nr: nextNr(last.nr), type: last.type, kar: last.kar, ref: last.ref, jfb: last.jfb } : { nr: isBolig(b) ? '1' : '-F1' }), true);
      break;
    }
    case 'close': closeSheet(); break;
    case 'savekurs': saveKurs(false); break;
    case 'savenext': saveKurs(true); break;
    case 'delkurs': {
      const i = b.kurser.findIndex(k => k.id === ui.editing.id); const removed = b.kurser[i];
      b.kurser.splice(i, 1); touch(b); closeSheet(); render();
      toast(`Slettet ${removed.nr || 'kurs'}`, 'Angre', () => { b.kurser.splice(i, 0, removed); touch(b); render(); });
      break;
    }
    case 'up': case 'down': {
      const i = b.kurser.findIndex(k => k.id === ui.editing.id), j = i + (a.dataset.a === 'up' ? -1 : 1);
      if (i < 0 || j < 0 || j >= b.kurser.length) { toast(a.dataset.a === 'up' ? 'Allerede øverst' : 'Allerede nederst'); break; }
      readForm($('#sheet'), ui.editing); b.kurser[i] = ui.editing;
      [b.kurser[i], b.kurser[j]] = [b.kurser[j], b.kurser[i]]; touch(b); render();
      toast(`Flyttet til plass ${j + 1} av ${b.kurser.length}`);
      break;
    }
    case 'dup': {
      const e = readForm($('#sheet'), ui.editing);
      const i = b.kurser.findIndex(k => k.id === e.id); if (i >= 0) b.kurser[i] = e;
      touch(b); render();
      openKurs(newKurs(Object.assign({}, e, { id: uid(), nr: nextNr(e.nr) })), true, e.id);
      toast('Kopi – juster og lagre');
      break;
    }
    case 'now': { const i = $('input[data-f="dato"]'); i.value = nowStr(); i.dispatchEvent(new Event('input', { bubbles: true })); break; }
    case 'print': doPrint(b); break;
    case 'share': exportJSON({ app: 'kursfortegnelse', version: 1, boards: [b] }, fileBase(b) + '.json'); break;
    case 'csv': exportCSV(b); break;
    case 'logostd': db.firma.logo = 'logo.png'; save(); updLogo(); break;
    case 'logonone': db.firma.logo = ''; save(); updLogo(); break;
    case 'savefirma': readForm($('#sheet'), db.firma); save(); closeSheet(); toast('Lagret'); break;
    case 'backup': exportJSON({ app: 'kursfortegnelse', version: 1, boards: db.boards, firma: db.firma }, `Kursfortegnelser backup ${new Date().toISOString().slice(0, 10)}.json`); break;
  }
});
$('#scrim').addEventListener('click', closeSheet);

document.addEventListener('input', ev => {
  const inp = ev.target.closest('input[data-f], textarea[data-f]'); if (!inp) return;
  const form = inp.closest('[data-form]');
  // sync chips
  if (form) $$(`[data-chips="${inp.dataset.f}"] .chip`, form).forEach(c => c.classList.toggle('on', c.dataset.v === inp.value.trim()));
  if (form && form.dataset.form === 'board') {
    const b = board(); b[inp.dataset.f] = inp.value.trim(); touch(b);
    if (['fordeling', 'anlegg', 'kunde', 'adresse', 'tavle'].includes(inp.dataset.f)) {
      const h = $('.top h1'); if (h) h.innerHTML = headTitle(b);
    }
  }
});
function updLogo() {
  const p = $('#logoPrev'); if (!p) return;
  p.innerHTML = db.firma.logo ? `<img src="${esc(db.firma.logo)}" style="max-width:100%;max-height:60px">` : '<span style="color:var(--muted)">Ingen logo – firmanavnet brukes</span>';
}
function loadLogo(file) {
  const img = new Image(), url = URL.createObjectURL(file);
  img.onload = () => {
    const sc = Math.min(1, 600 / img.width, 200 / img.height);
    const c = document.createElement('canvas'); c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    db.firma.logo = c.toDataURL('image/png'); save(); updLogo(); URL.revokeObjectURL(url);
  };
  img.onerror = () => toast('Kunne ikke lese bildet');
  img.src = url;
}
document.addEventListener('change', ev => {
  if (ev.target.matches('input[data-a="logo"]') && ev.target.files[0]) { loadLogo(ev.target.files[0]); ev.target.value = ''; return; }
  if (ev.target.matches('input[data-a="import"]') && ev.target.files[0]) { importFile(ev.target.files[0]); ev.target.value = ''; }
});
// Enter in kurs nr → go to description; Enter in description → save + next
document.addEventListener('keydown', ev => {
  if (ev.key !== 'Enter') return;
  const inp = ev.target.closest('#sheet input[data-f]'); if (!inp || ui.sheetMode !== 'kurs') return;
  ev.preventDefault();
  const all = $$('#sheet input[data-f]'); const i = all.indexOf(inp);
  if (all[i + 1]) all[i + 1].focus();
});

/* ================= Start ================= */
if ('serviceWorker' in navigator && !inFrame) {
  try { navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) {}
}
route();
</script>
